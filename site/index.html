<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xblog · 极客技术博客 & 玩机知识库</title>
  <meta name="description" content="Xblog官方博客，分享玩机折腾、系统管理与 Linux 运维、Cloudflare、Android TV 与极简科技生活。">
  <link rel="icon" type="image/png" href="assets/gradient-dark.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="enhancements.css">
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="music-player.css">

<body data-theme="tech">

  <!-- 专属主题过渡层 (不同主题专属动画控制器) -->

  <!-- 顶部导航栏 -->

    <div class="nav-container">
      <!-- 左侧：品牌头像与标题 -->
      <a href="#home" class="brand-wrap" onclick="navigateTo('home');">
        <img src="assets/gradient-dark.svg" alt="Xblog" class="brand-avatar" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100'">
        <div>
          <span class="brand-title">Xblog</span>
          <span class="brand-badge" id="header-user-level-badge" style="color: #94a3b8; border-color: #94a3b8;">游客</span>
        </div>
      </a>

      <!-- 中间：上排标签页 (首页、博客、后台) -->
      <nav class="nav-tabs-center">
        <button id="nav-tab-home" class="nav-tab-btn active" onclick="navigateTo('home');">首页</button>
        <button id="nav-tab-blog" class="nav-tab-btn" onclick="navigateTo('blog');">博客</button>
        <button id="nav-tab-admin" class="nav-tab-btn" onclick="navigateTo('admin');">后台</button>

      <!-- 右上角：官方图标 (YouTube, TG, GITHUB, 邮件, ads洽谈) -->
      
        <!-- 用户登录与等级切换快捷入口 -->
        <div id="nav-user-status-wrap" style="display: flex; align-items: center; gap: 6px;"></div>

        <div class="nav-right-socials">
        <button id="color-mode-toggle" type="button" aria-label="切换浅色主题" title="切换浅色主题">☀</button>
        <!-- YouTube 图标 -->
        <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" class="social-icon-btn" title="YouTube: @example">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>

        </a>

        <!-- 关于入口 (紧随 GitHub 之后) -->
        <a href="#about" class="social-icon-btn nav-text-btn" onclick="navigateTo('about');" title="关于Xblog与站长故事">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>关于</span>
        </a>

        <!-- 法律入口 (紧随 关于 之后) -->
        <a href="#legal" class="social-icon-btn nav-text-btn" onclick="navigateTo('legal');" title="法律条款、隐私保护政策与免责声明">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"></path>
            <path d="M12 8v4"></path>
            <path d="M12 16h.01"></path>
          </svg>
          <span>法律</span>
        </a>

        <!-- 邮件图标 (指向 hello@example.com) -->
        <a href="mailto:hello@example.com" class="social-icon-btn" title="邮件联系: hello@example.com">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </a>

        <!-- ads 商务洽谈 (指向电报 @Xzheteng8) -->
        <a href="https://t.me/Xzheteng8" target="_blank" rel="noopener noreferrer" class="ads-contact-btn" title="广告与商务洽谈: @Xzheteng8">
          <span>💼</span>
          <span>ads洽谈</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <!-- 1. 首页固定展示：Xblog深度频道介绍与专栏视图 -->
    <div id="home-intro-view"></div>

    <!-- 2. 博客知识库：分类管理、自动标签云与文章网格视图 -->
    <div id="blog-library-view" style="display: none;"></div>

    <!-- 3. 单篇博文详情视图 (在新窗口/页面中打开渲染) -->
    <div id="post-detail-view" style="display: none;"></div>

    <!-- 4. 金主爸爸专属广告自主对接平台视图 (不在首页导航显示，凭专属链接进入) -->
    <div id="sponsor-portal-view" style="display: none;"></div>

    <!-- 5. CMS 后台管理视图 (包含所有区域的单独管理功能) -->
    <div id="admin-view" style="display: none;"></div>

    <!-- 关于与免责声明视图容器 -->
    <div id="about-view" style="display: none;"></div>

    <!-- 法律条款与隐私政策合规视图容器 -->
    <div id="legal-view" style="display: none;"></div>

    <!-- 页面底部横幅广告位 (核心：空闲自动隐藏) -->
    <div id="ad-bottom-slot" class="ad-slot-container"></div>
  </main>

  <!-- 右下角浮动窗口广告位 (核心：空闲自动隐藏) -->
  <div id="ad-floating" style="display: none;"></div>

  <!-- 页脚 -->
  <footer style="border-top: 1px solid var(--border); padding: 36px 20px; text-align: center; color: var(--text-dim); font-size: 0.88rem; margin-top: 60px;">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
      <div>
        © 2026 <strong>Xblog</strong> · 极客动态博客 CMS · 开源发布
      </div>
      <div style="display: flex; gap: 16px; align-items: center;">
        <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" style="color: var(--text-muted); text-decoration: none;">YouTube @example</a>
        <a href="https://t.me/" target="_blank" rel="noopener noreferrer" style="color: var(--text-muted); text-decoration: none;">TG 交流群</a>
        <a href="https://github.com/" target="_blank" rel="noopener noreferrer" style="color: var(--text-muted); text-decoration: none;">GitHub @example</a>
        <a href="mailto:hello@example.com" style="color: var(--text-muted); text-decoration: none;">邮箱联系</a>
        <a href="https://t.me/Xzheteng8" target="_blank" rel="noopener noreferrer" style="color: #ffd700; text-decoration: none;">ads商务洽谈</a>
      </div>

      <!-- 最下方保留不可更改的开源网站 GitHub 跳转介绍 (@example · Xblog) -->
      <div style="border-top: 1px dashed var(--border); padding-top: 14px; margin-top: 16px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-dim);">
        <span>Built with</span>
        <a href="https://github.com/" target="_blank" rel="noopener noreferrer" style="color: var(--accent); font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
          <span>@example · Xblog</span>
        </a>
        <span>· 极客动态开源博客系统</span>
      </div>
    </div>
  </footer>

  <!-- 引入模块脚本 -->

  <script src="js/sponsor.js"></script>

  <script src="js/blog.js"></script>
  <script src="js/cms-editor.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/feature-pages.js"></script>
  <script src="js/video-ai.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', startCMS);
  </script>
  <script src="js/music-catalog.js"></script>
  <script src="js/music-player.js"></script>
</body>
</html>
